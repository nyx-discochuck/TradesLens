services:
  backend:
    build:
      context: ./backend
    container_name: dex_backend
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    networks:
      - dex_network
      - local_test_network

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "127.0.0.1:3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm ci --ignore-scripts && npm run dev -- --host 0.0.0.0"
    networks:
      - dex_network
      - local_test_network

  pharaoh-adapter:
    image: node:20-alpine
    working_dir: /app
    network_mode: host
    volumes:
      - ./pharaoh-adapter:/app:ro
    environment:
      PHARAOH_ADAPTER_HOST: 127.0.0.1
      AVAX_RADAR_GATEWAY_URL: http://127.0.0.1:43140
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    command: node server.mjs

networks:
  dex_network:
    driver: bridge
  local_test_network:
    external: true
